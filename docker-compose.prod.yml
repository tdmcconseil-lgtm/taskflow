# Déploiement en production (OVH VPS, etc.).
#   docker compose -f docker-compose.prod.yml up -d --build
# Nécessite un fichier .env à côté (voir .env.production.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  # Reverse proxy avec HTTPS automatique (Let's Encrypt) pour le domaine.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Definir DOMAIN dans .env}
      # Identifiants d'accès à la préprod (basic auth). Hash non versionné,
      # défini dans .env (STAGING_HASH = sortie de `caddy hash-password`).
      STAGING_USER: ${STAGING_USER:-preview}
      STAGING_HASH: ${STAGING_HASH:?Definir STAGING_HASH dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Réseau partagé avec la préproduction (docker-compose.staging.yml), pour que
# Caddy atteigne l'app de préprod. À créer une fois : docker network create edge
networks:
  edge:
    external: true
